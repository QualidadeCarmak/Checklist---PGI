<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGI Carmak — Checklist de Auditoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#0A2F5C;
  --navy-2:#0E4D8C;
  --blue:#1A6BB5;
  --blue-2:#3A8FD4;
  --accent:#C9A227;
  --tint:#EEF4FB;
  --tint-2:#F5F8FC;
  --page:#EEF4FB;
  --line:#D0DCEB;
  --line-2:#A8BDD6;
  --ink:#0A1F3A;
  --ink-2:#2A4060;
  --muted:#5A7088;
  --ok-bg:#E4F5EE; --ok-fg:#1E7F72;
  --w90-bg:#FFF6DF; --w90-fg:#8A6B00;
  --w30-bg:#FFEADD; --w30-fg:#B0500E;
  --late-bg:#FBEAE8; --late-fg:#C6483E;
  --radius:16px;
  --shadow: 0 8px 24px rgba(10,47,92,0.10);
  --primary: var(--navy);
  --primary-hover: var(--navy-2);
  --destaque: rgba(201,162,39,0.18);
  --vermelho: #C6483E;
  --laranja: #B0500E;
  --cinza: var(--ink);
  --cinza-medio: var(--muted);
  --cinza-claro: var(--tint-2);
  --borda: var(--line);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{margin:0;padding:0;}
body{
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(201,162,39,0.12), transparent 60%),
    var(--page);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.45;
}
::selection{ background: var(--blue); color:#fff; }
button, select, input, textarea{ font-family: inherit; }

.no-print{display:block;}
.print-only{display:none;}

/* Top bar — SGQ style */
.topbar{
  position: sticky; top:0; z-index: 50;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, var(--blue) 100%);
  color:#fff;
  padding: 0 28px;
  display:flex; align-items:center; gap:24px;
  height:68px;
  box-shadow: var(--shadow);
}
.brand{ display:flex; align-items:center; gap:14px; white-space:nowrap; }
.brand-logo{ height:28px; width:auto; display:block; }
.brand-text .t1{ font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; letter-spacing:.2px; line-height:1.1;}
.brand-text .t2{ font-size:11px; color:#E8C547; letter-spacing:.4px; }
.tabs{ display:flex; gap:4px; margin-left:8px; }
.tab-btn{
  appearance:none; border:none; background:transparent; color:rgba(255,255,255,0.72);
  padding:10px 16px; border-radius:100px; font-size:13px; font-weight:600;
  cursor:pointer; letter-spacing:.2px; transition: all .15s ease;
}
.tab-btn:hover{ background: rgba(255,255,255,.12); color:#fff; }
.tab-btn.active{ background:rgba(255,255,255,0.95); color: var(--navy); }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:14px; }

.container{ max-width:1100px; margin:0 auto; padding:28px 32px 100px; }

.card, .capitulo, .panel-like{
  background:#FBFDFC; border:1px solid var(--line); border-radius: var(--radius);
  padding:20px 22px; margin-bottom:14px; box-shadow: var(--shadow);
}
.card h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px; font-weight:700; color:var(--navy);
  margin-bottom:14px; letter-spacing:-.01em;
}
.grid-id{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:14px;
}
label{
  display:block; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.5px; color:var(--muted); font-weight:700; margin-bottom:5px;
}
input[type="text"], input[type="date"], select, textarea{
  width:100%; border:1px solid var(--line-2); border-radius:7px;
  padding:8px 11px; font-size:13px; background:#fff; color:var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus{
  outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
}

.capitulo{ padding:0; overflow:hidden; }
.capitulo-header{
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color:#fff; padding:12px 18px;
  display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; user-select:none;
}
.capitulo-header h3{
  font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700;
}
.capitulo-score{
  background:rgba(255,255,255,0.18); padding:3px 12px; border-radius:100px;
  font-size:12px; font-weight:600;
}
.capitulo-body{ padding:6px 0; }

.pergunta{
  display:grid; grid-template-columns: 1fr 180px 90px; gap:10px;
  align-items:center; padding:11px 18px; border-bottom:1px solid var(--line);
}
.pergunta:last-child{ border-bottom:none; }
.pergunta.critico{ background:#FFF9F0; }
.pergunta .codigo{ font-weight:700; color:var(--navy); font-size:12px; margin-right:6px; }
.pergunta .texto{ font-size:13px; color:var(--ink-2); }
.badge-critico{
  display:inline-block; background:var(--w30-fg); color:#fff;
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:6px;
}
select.resposta{ padding:7px 8px; font-size:12.5px; border-radius:7px; border:1px solid var(--line-2); }
select.resposta.conforme{ background:var(--ok-bg); border-color:#7BC9A8; color:var(--ok-fg); }
select.resposta.parcial{ background:var(--w90-bg); border-color:#E0B23A; color:var(--w90-fg); }
select.resposta.nc{ background:var(--late-bg); border-color:#E57373; color:var(--late-fg); }
select.resposta.na{ background:var(--off-bg,#EBEDF0); border-color:#B0B8C0; color:#565D6B; }
.pontos-display{ text-align:center; font-weight:700; font-size:13px; color:var(--muted); }

.obs-nc{
  margin-top:6px; width:100%; font-size:12.5px; padding:8px 10px;
  border:1px dashed #F5C6C2; border-radius:7px; background:#FFF8F7; display:none;
}
.pergunta.has-nc .obs-nc{ display:block; grid-column:1 / -1; }

.anexos-area{
  display:none; grid-column:1 / -1; margin-top:8px; padding:12px;
  background:var(--tint-2); border:1px dashed var(--line-2); border-radius:10px;
}
.pergunta.has-anexo .anexos-area{ display:block; }
.anexos-label{ font-size:11px; color:var(--muted); margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
.anexos-thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.anexo-thumb{
  position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden;
  border:1px solid var(--line); background:#EEE;
}
.anexo-thumb img{ width:100%; height:100%; object-fit:cover; }
.anexo-thumb .btn-rem{
  position:absolute; top:2px; right:2px; width:20px; height:20px; border:none;
  border-radius:50%; background:rgba(198,72,62,0.9); color:#fff; font-size:12px;
  line-height:1; cursor:pointer; padding:0;
}
.anexos-area input[type="file"]{ font-size:12px; max-width:100%; }
.anexos-hint{ font-size:11px; color:var(--muted); margin-top:4px; }

.acoes-card{ display:flex; justify-content:flex-end; gap:12px; padding:16px 0 8px; }
.btn{
  padding:10px 18px; border:none; border-radius:8px; font-weight:600; font-size:13px;
  cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:7px;
}
.btn-primary{ background:var(--navy); color:#fff; }
.btn-primary:hover{ background:var(--navy-2); transform:translateY(-1px); }
.btn-secondary{ background:#fff; color:var(--ink-2); border:1px solid var(--line-2); }
.btn-secondary:hover{ background:var(--tint-2); }
.btn-sm{ padding:6px 12px; font-size:12px; }
.btn-danger{ background:var(--late-bg); color:var(--late-fg); border:1px solid #F5C6C2; }
.btn-danger:hover{ background:#FBE0DC; }

.resumo-bar{
  position:fixed; bottom:0; left:0; right:0; background:#FBFDFC;
  border-top:2px solid var(--navy); padding:12px 28px;
  display:flex; justify-content:space-between; align-items:center; z-index:90;
  box-shadow: 0 -4px 20px rgba(11,59,62,0.08);
}
.resumo-bar .metricas{ display:flex; gap:28px; align-items:center; }
.resumo-bar .metrica{ text-align:center; }
.resumo-bar .metrica .valor{
  font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:var(--navy);
}
.resumo-bar .metrica .label{
  font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600;
}
.selo-badge{
  display:inline-flex; align-items:center; gap:6px; padding:6px 16px;
  border-radius:100px; font-weight:700; font-size:13px; color:#fff;
}
.selo-diamante{ background:linear-gradient(135deg,#1565C0,#42A5F5); }
.selo-ouro{ background:linear-gradient(135deg,#C79A45,#E0B23A); color:#2A2000; }
.selo-prata{ background:linear-gradient(135deg,#5B6472,#9AA1AC); }
.selo-bronze{ background:linear-gradient(135deg,#8D6E63,#BCAAA4); }
.selo-compromisso{ background:linear-gradient(135deg,#C6483E,#E57373); }

.historico-section{ display:none; }
.historico-section.active{ display:block; }
.checklist-section.oculto{ display:none; }

.filtros-bar{
  display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:16px;
}
.filtros-bar .filtro-item{ flex:1; min-width:140px; }

.historico-lista{ display:flex; flex-direction:column; gap:10px; }
.historico-item{
  background:#FBFDFC; border:1px solid var(--line); border-radius:12px;
  padding:14px 18px; display:grid; grid-template-columns:1fr auto; gap:12px;
  align-items:center; box-shadow:var(--shadow); transition:box-shadow .15s;
}
.historico-item:hover{ box-shadow:0 8px 28px rgba(11,59,62,0.12); }
.historico-item .info h4{
  font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--navy); margin-bottom:4px;
}
.historico-item .info .meta{
  font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:12px;
}
.historico-item .acoes-item{ display:flex; gap:8px; align-items:center; }
.historico-vazio{ text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }

.toast{
  position:fixed; top:80px; right:20px; background:var(--navy); color:#fff;
  padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:200;
  box-shadow:var(--shadow); opacity:0; transform:translateY(-10px); transition:all .3s;
}
.toast.visivel{ opacity:1; transform:translateY(0); }

.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(11,59,62,0.45);
  z-index:300; justify-content:center; align-items:flex-start;
  padding:30px 16px; overflow-y:auto;
}
.modal-overlay.aberto{ display:flex; }
.modal-content{
  background:#FBFDFC; border-radius:var(--radius); max-width:820px; width:100%;
  padding:28px; position:relative; box-shadow:0 16px 48px rgba(11,59,62,0.2);
}
.modal-close{
  position:absolute; top:12px; right:16px; background:none; border:none;
  font-size:1.4rem; cursor:pointer; color:var(--muted); line-height:1;
}
.modal-close:hover{ color:var(--ink); }
.modal-actions{
  display:flex; justify-content:flex-end; gap:10px; margin-top:20px;
  padding-top:14px; border-top:1px solid var(--line);
}


/* Relatório — visual Safira & Ouro (tela + modal) */
.rel-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:14px; padding-bottom:12px; border-bottom:3px solid #C9A227; }
.rel-selo{ width:96px; height:96px; object-fit:contain; flex-shrink:0; }
.rel-header-text{ flex:1; }
.rel-header-text h1{ color:#0A2F5C; font-size:1.15rem; margin:0 0 2px; font-family:'Space Grotesk',Inter,sans-serif; }
.rel-header-text .sub{ color:#C9A227; font-size:0.78rem; font-weight:700; letter-spacing:.3px; margin:0 0 10px; }
.rel-meta{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px 14px; font-size:0.82rem; }
.rel-meta strong{ color:#0A2F5C; }
.rel-score-box{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:linear-gradient(135deg,#0A2F5C 0%,#0E4D8C 100%);
  color:#fff; border-radius:12px; padding:16px 22px; margin:14px 0 18px;
  box-shadow:0 6px 18px rgba(10,47,92,0.18);
}
.rel-score-box .pct{ font-size:2rem; font-weight:800; line-height:1; color:#E8C547; font-family:'Space Grotesk',sans-serif; }
.rel-score-box .selo-nome{ font-size:1.15rem; font-weight:700; }
.rel-score-box .meta-score{ font-size:0.75rem; opacity:.9; margin-top:2px; }
.rel-cap-title{
  background:#0A2F5C; color:#fff; padding:8px 14px; border-radius:8px 8px 0 0;
  font-size:0.88rem; font-weight:700; margin:16px 0 0; display:flex; justify-content:space-between; align-items:center;
}
.rel-cap-title .cap-meta{ font-weight:500; font-size:0.78rem; color:#E8C547; }
table.relatorio-tabela{ width:100%; border-collapse:collapse; margin:0 0 10px; font-size:0.8rem; border:1px solid #D0DCEB; }
table.relatorio-tabela th{ background:#EEF4FB; color:#0A2F5C; padding:6px 10px; text-align:left; border-bottom:2px solid #C9A227; font-size:0.72rem; text-transform:uppercase; letter-spacing:.3px; }
table.relatorio-tabela td{ border:1px solid #E8EEF5; padding:5px 10px; }
table.relatorio-tabela tr:nth-child(even){ background:#F8FAFC; }
.badge-c{ color:#1E7F72; font-weight:700; }
.badge-p{ color:#8A6B00; font-weight:700; }
.badge-nc{ color:#C6483E; font-weight:700; }
.badge-na{ color:#5A7088; }
.nc-item{ border-left:3px solid #C6483E; padding:8px 12px; margin-bottom:8px; background:#FFF8F8; border-radius:0 8px 8px 0; font-size:0.82rem; }
.rel-section-title{ font-size:1rem; color:#0A2F5C; border-bottom:2px solid #C9A227; padding-bottom:4px; margin:20px 0 10px; font-weight:700; font-family:'Space Grotesk',sans-serif; }
.rel-section-title.nc{ color:#C6483E; border-color:#C6483E; }
.rel-assinaturas{ display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:36px; }
.rel-assinaturas .linha{ border-top:1px solid #0A2F5C; padding-top:6px; text-align:center; font-size:0.82rem; }
.rel-footer{ margin-top:24px; font-size:0.7rem; color:#8A9BB0; text-align:center; border-top:1px solid #D0DCEB; padding-top:8px; }

@media print{
  body{ background:#fff; font-size:11px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .no-print{ display:none !important; }
  .print-only{ display:block !important; }
  .resumo-bar, .modal-overlay, .toast, .topbar{ display:none !important; }
  .relatorio-print{ max-width:100%; padding:0; color:#0A1F3A; }
  .rel-header{ display:flex; align-items:flex-start; gap:18px; margin-bottom:14px; padding-bottom:12px; border-bottom:3px solid #C9A227; }
  .rel-selo{ width:90px; height:90px; object-fit:contain; flex-shrink:0; }
  .rel-header-text{ flex:1; }
  .rel-header-text h1{ color:#0A2F5C; font-size:15pt; margin:0 0 2px; font-family:Inter,Arial,sans-serif; }
  .rel-header-text .sub{ color:#C9A227; font-size:9pt; font-weight:700; letter-spacing:.3px; margin:0 0 8px; }
  .rel-meta{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px 16px; font-size:9pt; }
  .rel-meta strong{ color:#0A2F5C; }
  .rel-score-box{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:linear-gradient(135deg,#0A2F5C 0%,#0E4D8C 100%);
    color:#fff; border-radius:10px; padding:14px 20px; margin:14px 0 18px;
  }
  .rel-score-box .pct{ font-size:28pt; font-weight:800; line-height:1; color:#E8C547; }
  .rel-score-box .selo-nome{ font-size:14pt; font-weight:700; }
  .rel-score-box .meta-score{ font-size:8.5pt; opacity:.9; margin-top:2px; }
  .rel-cap-title{
    background:#0A2F5C; color:#fff; padding:7px 12px; border-radius:6px 6px 0 0;
    font-size:10pt; font-weight:700; margin:16px 0 0; display:flex; justify-content:space-between; align-items:center;
  }
  .rel-cap-title .cap-meta{ font-weight:400; font-size:9pt; color:#E8C547; }
  table.relatorio-tabela{ width:100%; border-collapse:collapse; margin:0 0 8px; font-size:8.5pt; border:1px solid #D0DCEB; }
  table.relatorio-tabela th{ background:#EEF4FB; color:#0A2F5C; padding:5px 8px; text-align:left; border-bottom:2px solid #C9A227; font-size:8pt; text-transform:uppercase; letter-spacing:.3px; }
  table.relatorio-tabela td{ border:1px solid #E8EEF5; padding:4px 8px; }
  table.relatorio-tabela tr:nth-child(even){ background:#F8FAFC; }
  .badge-c{ color:#1E7F72; font-weight:700; }
  .badge-p{ color:#8A6B00; font-weight:700; }
  .badge-nc{ color:#C6483E; font-weight:700; }
  .badge-na{ color:#5A7088; }
  .nc-item{ border-left:3px solid #C6483E; padding:8px 12px; margin-bottom:8px; background:#FFF8F8; border-radius:0 6px 6px 0; font-size:9pt; }
  .page-break{ page-break-before:always; }
  .rel-section-title{ font-size:11pt; color:#0A2F5C; border-bottom:2px solid #C9A227; padding-bottom:4px; margin:20px 0 10px; font-weight:700; }
  .rel-section-title.nc{ color:#C6483E; border-color:#C6483E; }
  .rel-assinaturas{ display:grid; grid-template-columns:1fr 1fr; gap:40px; margin-top:36px; }
  .rel-assinaturas .linha{ border-top:1px solid #0A2F5C; padding-top:6px; text-align:center; font-size:9pt; }
  .rel-footer{ margin-top:24px; font-size:7.5pt; color:#8A9BB0; text-align:center; border-top:1px solid #D0DCEB; padding-top:8px; }
}

</style>
</head>
<body>
<div class="no-print">

    <div class="tabs">
      <button class="tab-btn active" id="nav-checklist" onclick="mostrarAba('checklist')">Checklist</button>

    </div>
  </header>

  <div class="container">
    <div id="aba-checklist" class="checklist-section">
      <div class="card">
        <h2>Identificação da Auditoria</h2>
        <div class="grid-id">
          <div>
            <label>Filial</label>
            <input type="text" id="filial" placeholder="Ex: Matriz RS">
          </div>
          <div>
            <label>Data da Auditoria</label>
            <input type="date" id="data">
          </div>
          <div>
            <label>Auditor</label>
            <input type="text" id="auditor" placeholder="Nome do auditor">
          </div>
          <div>
            <label>Gestor da Filial</label>
            <input type="text" id="gestor" placeholder="Nome do gestor">
          </div>
        </div>
      </div>

      <div id="capitulos"></div>

      <div class="card">
        <h2>Observações Gerais do Auditor</h2>
        <textarea id="obs-gerais" rows="4" placeholder="Comentários gerais, pontos de atenção, destaques positivos..."></textarea>
      </div>

      <div class="acoes-card">
        <button class="btn btn-secondary" onclick="limparTudo()">Limpar</button>
        <button class="btn btn-primary" onclick="gerarESalvarRelatorio()">Gerar Relatório PDF</button>
      </div>
    </div>

    <div id="aba-historico" class="historico-section">
      <div class="card">
        <h2>Histórico de Relatórios</h2>
        <div class="filtros-bar">
          <div class="filtro-item">
            <label>Filial</label>
            <input type="text" id="filtro-filial" placeholder="Filtrar por filial..." oninput="renderHistorico()">
          </div>
          <div class="filtro-item">
            <label>Selo</label>
            <select id="filtro-selo" onchange="renderHistorico()">
              <option value="">Todos</option>
              <option value="Diamante">Diamante</option>
              <option value="Ouro">Ouro</option>
              <option value="Prata">Prata</option>
              <option value="Bronze">Bronze</option>
              <option value="Compromisso">Compromisso</option>
            </select>
          </div>
          <div class="filtro-item">
            <label>Data inicial</label>
            <input type="date" id="filtro-data-ini" onchange="renderHistorico()">
          </div>
          <div class="filtro-item">
            <label>Data final</label>
            <input type="date" id="filtro-data-fim" onchange="renderHistorico()">
          </div>
          <div class="filtro-item" style="flex:0; min-width:auto;">
            <label>&nbsp;</label>
            <button class="btn btn-secondary btn-sm" onclick="limparFiltros()">Limpar filtros</button>
          </div>
        </div>
        <div class="historico-lista" id="historico-lista"></div>
      </div>
    </div>
  </div>

  <div class="resumo-bar" id="resumo-bar">
    <div class="metricas">
      <div class="metrica">
        <div class="valor" id="pontos-obtidos">0</div>
        <div class="label">Pontos Obtidos</div>
      </div>
      <div class="metrica">
        <div class="valor" id="pontos-possiveis">0</div>
        <div class="label">Pontos Possíveis</div>
      </div>
      <div class="metrica">
        <div class="valor" id="percentual">0%</div>
        <div class="label">Percentual</div>
      </div>
      <div class="metrica">
        <div class="valor" id="nc-criticas">0</div>
        <div class="label">NC Críticas</div>
      </div>
    </div>
    <div class="selo-area" style="display:flex; align-items:center; gap:12px;">
      <img id="selo-logo" src="" alt="" style="display:none; height:56px; width:auto; object-fit:contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));">
      <span class="selo-badge selo-compromisso" id="selo-atual">Selo de Compromisso</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay no-print" id="modal-relatorio">
  <div class="modal-content">
    <button class="modal-close" onclick="fecharModal()">&times;</button>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="fecharModal()">Fechar</button>
      <button class="btn btn-primary" onclick="imprimirRelatorioAtual()">Imprimir / Salvar PDF</button>
    </div>
  </div>
</div>

  if (aba === 'historico') renderHistorico();
}

function pontosDaResposta(val) {
  if (val === 'C') return 10;
  if (val === 'P') return 5;
  if (val === 'NC') return 0;
  return null;
}

function atualizarResposta(select) {
  const cod = select.dataset.cod;
  const val = select.value;
  const ptsEl = document.getElementById('pts-' + cod);
  const perguntaEl = select.closest('.pergunta');
  select.classList.remove('conforme', 'parcial', 'nc', 'na');
  if (val === 'C') select.classList.add('conforme');
  else if (val === 'P') select.classList.add('parcial');
  else if (val === 'NC') select.classList.add('nc');
  else if (val === 'NA') select.classList.add('na');

  // Observação: NC ou Parcial
  if (val === 'NC' || val === 'P') perguntaEl.classList.add('has-nc');
  else perguntaEl.classList.remove('has-nc');

  // Anexos: qualquer resposta que não seja vazio nem N/A
  if (val === 'C' || val === 'P' || val === 'NC') {
    perguntaEl.classList.add('has-anexo');
  } else {
    perguntaEl.classList.remove('has-anexo');
  }

  const pts = pontosDaResposta(val);
  ptsEl.textContent = pts !== null ? pts : (val === 'NA' ? 'N/A' : '—');
  recalcularTudo();
}

function comprimirImagem(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > MAX_LARGURA_IMG) {
          h = Math.round(h * (MAX_LARGURA_IMG / w));
          w = MAX_LARGURA_IMG;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderThumbs(cod) {
  const box = document.getElementById('thumbs-' + cod);
  if (!box) return;
  const lista = imagensPorPergunta[cod] || [];
  box.innerHTML = lista.map(function(img, idx) {
    return '<div class="anexo-thumb">' +
      '<img src="' + img.dataUrl + '" alt="' + (img.nome || '') + '">' +
      '<button type="button" class="btn-rem" title="Remover" onclick="removerImagem(\'' + cod + '\',' + idx + ')">&times;</button>' +
      '</div>';
  }).join('');
}

function adicionarImagens(input) {
  const cod = input.dataset.cod;
  if (!imagensPorPergunta[cod]) imagensPorPergunta[cod] = [];
  const atuais = imagensPorPergunta[cod];
  const files = Array.from(input.files || []);
  const restantes = MAX_IMAGENS_POR_ITEM - atuais.length;
  if (restantes <= 0) {
    mostrarToast('Máximo de ' + MAX_IMAGENS_POR_ITEM + ' imagens por item.');
    input.value = '';
    return;
  }
  const selecionados = files.slice(0, restantes);
  Promise.all(selecionados.map(function(f) {
    return comprimirImagem(f).then(function(dataUrl) {
      return { id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), dataUrl: dataUrl, nome: f.name };
    });
  })).then(function(novas) {
    imagensPorPergunta[cod] = atuais.concat(novas);
    renderThumbs(cod);
    if (files.length > restantes) {
      mostrarToast('Apenas ' + restantes + ' imagem(ns) adicionada(s) (limite por item).');
    }
  }).catch(function() {
    mostrarToast('Erro ao processar uma ou mais imagens.');
  });
  input.value = '';
}

function removerImagem(cod, idx) {
  if (!imagensPorPergunta[cod]) return;
  imagensPorPergunta[cod].splice(idx, 1);
  renderThumbs(cod);
}

function recalcularTudo() {
  let totalObtidos = 0, totalPossiveis = 0, ncCriticas = 0;
  let somaPonderada = 0;
  let somaPesosAplicaveis = 0;
  const detalheCapitulos = [];

  CAPITULOS.forEach(cap => {
    let capObt = 0, capPos = 0;
    cap.perguntas.forEach(p => {
      const select = document.querySelector('select.resposta[data-cod="' + p.cod + '"]');
      const val = select ? select.value : '';
      const pts = pontosDaResposta(val);
      if (pts !== null) {
        capObt += pts;
        capPos += 10;
        totalObtidos += pts;
        totalPossiveis += 10;
        if (val === 'NC' && p.critico) {
          ncCriticas++;
        }
      }
    });

    // Percentual do capítulo (N/A excluídos)
    const pctCap = capPos > 0 ? (capObt / capPos) * 100 : null;
    const scoreEl = document.getElementById('score-' + cap.id);
    if (scoreEl) {
      if (pctCap !== null) {
        scoreEl.textContent = pctCap.toFixed(0) + '%  (' + capObt + '/' + capPos + ')';
      } else {
        scoreEl.textContent = 'N/A';
      }
    }

    if (pctCap !== null) {
      somaPonderada += pctCap * cap.peso;
      somaPesosAplicaveis += cap.peso;
    }
    detalheCapitulos.push({ id: cap.id, nome: cap.nome, peso: cap.peso, pct: pctCap, obt: capObt, pos: capPos });
  });

  // Média ponderada: normaliza pelos pesos dos capítulos que tiveram itens aplicáveis
  const percentual = somaPesosAplicaveis > 0
    ? (somaPonderada / somaPesosAplicaveis)
    : 0;

  document.getElementById('pontos-obtidos').textContent = totalObtidos;
  document.getElementById('pontos-possiveis').textContent = totalPossiveis;
  document.getElementById('percentual').textContent = percentual.toFixed(1) + '%';
  document.getElementById('nc-criticas').textContent = ncCriticas;

  const classificacao = classificar(percentual, ncCriticas);
  atualizarSeloVisual(classificacao);

  return {
    totalObtidos,
    totalPossiveis,
    percentual,
    ncCriticas,
    classificacao,
    detalheCapitulos
  };
}

function classificar(percentual, ncCriticas) {
  // Regras conforme Manual PGI (apresentação):
  // Diamante = 100% + zero NC crítica
  // Ouro = 90–99%
  // Prata = 80–89%
  // Bronze = 75–79%
  // Compromisso = < 75%
  // NC crítica bloqueia apenas o Diamante

  if (percentual >= 100 && ncCriticas === 0) {
    return { nome: 'Selo Diamante', classe: 'selo-diamante', curto: 'Diamante', chave: 'diamante', motivo: '' };
  }
  if (percentual >= 100 && ncCriticas > 0) {
    // 100% mas com NC crítica → desce para Ouro
    return { nome: 'Selo Ouro', classe: 'selo-ouro', curto: 'Ouro', chave: 'ouro', motivo: 'NC crítica impede Diamante' };
  }
  if (percentual >= 90) {
    return { nome: 'Selo Ouro', classe: 'selo-ouro', curto: 'Ouro', chave: 'ouro', motivo: '' };
  }
  if (percentual >= 80) {
    return { nome: 'Selo Prata', classe: 'selo-prata', curto: 'Prata', chave: 'prata', motivo: '' };
  }
  if (percentual >= 75) {
    return { nome: 'Selo Bronze', classe: 'selo-bronze', curto: 'Bronze', chave: 'bronze', motivo: '' };
  }
  return { nome: 'Selo de Compromisso', classe: 'selo-compromisso', curto: 'Compromisso', chave: 'compromisso', motivo: 'Percentual abaixo de 75%' };
}

function atualizarSeloVisual(classificacao) {
  const seloEl = document.getElementById('selo-atual');
  const imgEl = document.getElementById('selo-logo');
  if (!seloEl) return;

  seloEl.textContent = classificacao.nome;
  seloEl.className = 'selo-badge ' + classificacao.classe;

  if (imgEl && typeof SELOS_IMG !== 'undefined' && SELOS_IMG[classificacao.chave]) {
    imgEl.src = SELOS_IMG[classificacao.chave];
    imgEl.alt = classificacao.nome;
    imgEl.style.display = 'block';
  } else if (imgEl) {
    imgEl.style.display = 'none';
  }
}


function coletarRespostas() {
  const respostas = {};
  CAPITULOS.forEach(cap => {
    cap.perguntas.forEach(p => {
      const select = document.querySelector('select.resposta[data-cod="' + p.cod + '"]');
      const obs = document.getElementById('obs-' + p.cod);
      respostas[p.cod] = {
        valor: select ? select.value : '',
        obs: obs ? obs.value : '',
        critico: p.critico,
        texto: p.texto,
        imagens: (imagensPorPergunta[p.cod] || []).map(function(i) {
          return { dataUrl: i.dataUrl, nome: i.nome };
        })
      };
    });
  });
  return respostas;
}

function htmlImagensItem(imagens) {
  if (!imagens || !imagens.length) return '';
  var html = '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">';
  imagens.forEach(function(img) {
    html += '<img src="' + img.dataUrl + '" alt="' + (img.nome || 'evidência') + '" style="max-width:180px; max-height:140px; object-fit:contain; border:1px solid #CCC; border-radius:4px;">';
  });
  html += '</div>';
  return html;
}

function montarHTMLRelatorio(dados, meta, respostas) {
  let tabelasCapitulos = '';
  let listaNCs = '';
  let listaEvidencias = '';
  let temNC = false;
  let temEvidencia = false;

  CAPITULOS.forEach(cap => {
    let rows = '';
    let capObt = 0, capPos = 0;
    cap.perguntas.forEach(p => {
      const r = respostas[p.cod] || {};
      const val = r.valor || '';
      const pts = pontosDaResposta(val);
      let label = '—';
      let labelClass = '';
      if (val === 'C') { label = 'Conforme'; labelClass = 'badge-c'; }
      else if (val === 'P') { label = 'Parcial'; labelClass = 'badge-p'; }
      else if (val === 'NC') { label = 'Não Conforme'; labelClass = 'badge-nc'; }
      else if (val === 'NA') { label = 'N/A'; labelClass = 'badge-na'; }
      const ptsTxt = pts !== null ? pts : (val === 'NA' ? 'N/A' : '—');
      const critMark = p.critico ? ' *' : '';
      const nImg = (r.imagens && r.imagens.length) ? r.imagens.length : 0;
      const imgHint = nImg > 0 ? ' <span style="color:#5A7088;font-size:8pt;">(' + nImg + ' img)</span>' : '';
      rows += '<tr><td style="width:48px;font-weight:700;color:#0A2F5C;">' + p.cod + critMark + '</td><td>' + p.texto + '</td><td class="' + labelClass + '" style="width:110px;">' + label + imgHint + '</td><td style="text-align:center;width:52px;font-weight:600;">' + ptsTxt + '</td></tr>';
      if (pts !== null) { capObt += pts; capPos += 10; }
      if (val === 'NC' || val === 'P') {
        temNC = true;
        listaNCs += '<div class="nc-item"><strong style="color:#0A2F5C;">' + p.cod + (p.critico ? ' <span style="color:#C6483E;">(CRÍTICO)</span>' : '') + ' — ' + label + '</strong><br>' + p.texto + '<br>' +
          (r.obs ? '<em style="color:#5A7088;">Observação: ' + r.obs + '</em>' : '<em style="color:#8A9BB0;">Sem observação registrada</em>') +
          htmlImagensItem(r.imagens) + '</div>';
      }
      if (nImg > 0) {
        temEvidencia = true;
        listaEvidencias += '<div style="margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #E8EEF5;">' +
          '<strong style="color:#0A2F5C;">' + p.cod + '</strong> — ' + p.texto + ' <span style="color:#5A7088;">(' + label + ')</span>' +
          htmlImagensItem(r.imagens) + '</div>';
      }
    });
    const pctCap = capPos > 0 ? ((capObt / capPos) * 100).toFixed(0) + '%' : 'N/A';
    const pesoPct = (cap.peso * 100).toFixed(0) + '%';
    tabelasCapitulos +=
      '<div class="rel-cap-title"><span>' + cap.nome + '</span><span class="cap-meta">' + pctCap + ' · peso ' + pesoPct + ' · ' + capObt + '/' + capPos + ' pts</span></div>' +
      '<table class="relatorio-tabela"><thead><tr><th style="width:48px">Cód.</th><th>Requisito</th><th style="width:110px">Resultado</th><th style="width:52px;text-align:center">Pontos</th></tr></thead><tbody>' + rows + '</tbody></table>';
  });

  const motivoExtra = dados.classificacao.motivo
    ? '<div class="meta-score" style="color:#FFCDD2;">' + dados.classificacao.motivo + '</div>'
    : '';

  const seloSrc = (typeof SELOS_IMG !== 'undefined' && SELOS_IMG[dados.classificacao.chave])
    ? SELOS_IMG[dados.classificacao.chave]
    : '';
  const seloImg = seloSrc
    ? '<img class="rel-selo" src="' + seloSrc + '" alt="' + dados.classificacao.nome + '">'
    : '';

  return '' +
    '<div class="rel-header">' +
      seloImg +
      '<div class="rel-header-text">' +
        '<h1>Relatório de Auditoria — Programa de Gestão Integrada (PGI)</h1>' +
        '<p class="sub">CARMAK · Sistema de Avaliação de Filiais</p>' +
        '<div class="rel-meta">' +
          '<div><strong>Filial:</strong> ' + meta.filial + '</div>' +
          '<div><strong>Data:</strong> ' + meta.data + '</div>' +
          '<div><strong>Auditor:</strong> ' + meta.auditor + '</div>' +
          '<div><strong>Gestor da Filial:</strong> ' + meta.gestor + '</div>' +
          '<div><strong>Pontos Obtidos:</strong> ' + dados.totalObtidos + '</div>' +
          '<div><strong>Pontos Possíveis:</strong> ' + dados.totalPossiveis + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="rel-score-box">' +
      '<div>' +
        '<div class="pct">' + dados.percentual.toFixed(1) + '%</div>' +
        '<div class="meta-score">Média ponderada por capítulo</div>' +
      '</div>' +
      '<div style="text-align:right;">' +
        '<div class="selo-nome">' + dados.classificacao.nome + '</div>' +
        '<div class="meta-score">NC Críticas: ' + dados.ncCriticas + '</div>' +
        motivoExtra +
      '</div>' +
    '</div>' +
    '<div class="rel-section-title">Resultado por Capítulo</div>' +
    tabelasCapitulos +
    '<div class="page-break"></div>' +
    '<div class="rel-section-title nc">Não Conformidades e Parciais</div>' +
    '<div class="nc-list">' + (temNC ? listaNCs : '<p style="color:#5A7088;font-size:9pt;">Nenhuma não conformidade ou parcial registrada.</p>') + '</div>' +
    (temEvidencia ? '<div class="page-break"></div><div class="rel-section-title">Evidências fotográficas</div>' + listaEvidencias : '') +
    (meta.obsGerais ? '<div class="rel-section-title">Observações Gerais do Auditor</div><p style="font-size:9.5pt; white-space:pre-wrap;">' + meta.obsGerais + '</p>' : '') +
    '<div class="rel-assinaturas">' +
      '<div class="linha">Auditor<br><strong>' + meta.auditor + '</strong></div>' +
      '<div class="linha">Gestor da Filial<br><strong>' + meta.gestor + '</strong></div>' +
    '</div>' +
    '<p class="rel-footer">Documento gerado pelo Checklist PGI Carmak · Itens marcados com * são críticos · Layout Safira &amp; Ouro</p>';
}


function gerarESalvarRelatorio() {
  const dados = recalcularTudo();
  const meta = {
    filial: document.getElementById('filial').value || '—',
    data: document.getElementById('data').value || '—',
    auditor: document.getElementById('auditor').value || '—',
    gestor: document.getElementById('gestor').value || '—',
    obsGerais: document.getElementById('obs-gerais').value || ''
  };
  const respostas = coletarRespostas();
  const html = montarHTMLRelatorio(dados, meta, respostas);
  const historico = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const registro = {
    id: Date.now(),
    criadoEm: new Date().toISOString(),
    filial: meta.filial,
    data: meta.data,
    auditor: meta.auditor,
    gestor: meta.gestor,
    percentual: dados.percentual,
    selo: dados.classificacao.curto,
    seloNome: dados.classificacao.nome,
    pontosObtidos: dados.totalObtidos,
    pontosPossiveis: dados.totalPossiveis,
    ncCriticas: dados.ncCriticas,
    html: html
  };
  historico.unshift(registro);
  if (historico.length > 50) historico.length = 50;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(historico));
  mostrarToast('Relatório salvo no histórico!');
  abrirRelatorio(registro.id);
}

function getHistorico() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
}

function renderHistorico() {
  const lista = document.getElementById('historico-lista');
  let items = getHistorico();
  const fFilial = (document.getElementById('filtro-filial').value || '').toLowerCase().trim();
  const fSelo = document.getElementById('filtro-selo').value;
  const fIni = document.getElementById('filtro-data-ini').value;
  const fFim = document.getElementById('filtro-data-fim').value;
  items = items.filter(function(r) {
    if (fFilial && !(r.filial || '').toLowerCase().includes(fFilial)) return false;
    if (fSelo && r.selo !== fSelo) return false;
    if (fIni && r.data && r.data < fIni) return false;
    if (fFim && r.data && r.data > fFim) return false;
    return true;
  });
  if (items.length === 0) {
    lista.innerHTML = '<div class="historico-vazio">Nenhum relatório encontrado.<br>Gere um relatório na aba Checklist para começar.</div>';
    return;
  }
  lista.innerHTML = items.map(function(r) {
    const seloClass = { 'Diamante': 'selo-diamante', 'Ouro': 'selo-ouro', 'Prata': 'selo-prata', 'Bronze': 'selo-bronze', 'Compromisso': 'selo-compromisso' }[r.selo] || 'selo-compromisso';
    const criado = new Date(r.criadoEm).toLocaleString('pt-BR');
    return '<div class="historico-item"><div class="info"><h4>' + (r.filial || 'Sem filial') + ' — ' + r.percentual.toFixed(1) + '%</h4>' +
      '<div class="meta"><span>Data: ' + (r.data || '—') + '</span><span>Auditor: ' + (r.auditor || '—') + '</span>' +
      '<span>NC críticas: ' + r.ncCriticas + '</span><span style="opacity:0.7">Salvo em ' + criado + '</span></div></div>' +
      '<div class="acoes-item"><span class="selo-badge ' + seloClass + '" style="font-size:0.78rem; padding:4px 12px;">' + r.seloNome + '</span>' +
      '<button class="btn btn-primary btn-sm" onclick="abrirRelatorio(' + r.id + ')">Abrir</button>' +
      '<button class="btn btn-danger btn-sm" onclick="excluirRelatorio(' + r.id + ')">Excluir</button></div></div>';
  }).join('');
}

function limparFiltros() {
  document.getElementById('filtro-filial').value = '';
  document.getElementById('filtro-selo').value = '';
  document.getElementById('filtro-data-ini').value = '';
  document.getElementById('filtro-data-fim').value = '';

}

function excluirRelatorio(id) {
  if (!confirm('Excluir este relatório do histórico?')) return;
  var hist = getHistorico().filter(function(r) { return r.id !== id; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
  renderHistorico();
  mostrarToast('Relatório excluído.');
}

function abrirRelatorio(id) {
  var reg = getHistorico().find(function(r) { return r.id === id; });
  if (!reg) return;
  relatorioAtualHTML = reg.html;
  document.getElementById('modal-body').innerHTML = reg.html;
  document.getElementById('modal-relatorio').classList.add('aberto');
}

function fecharModal() {
  document.getElementById('modal-relatorio').classList.remove('aberto');
}

function imprimirRelatorioAtual() {
  document.getElementById('area-impressao').innerHTML = '<div class="relatorio-print">' + relatorioAtualHTML + '</div>';
  setTimeout(function() { window.print(); }, 150);
}

function mostrarToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visivel');
  setTimeout(function() { t.classList.remove('visivel'); }, 2800);
}

function limparTudo() {
  if (!confirm('Deseja limpar todas as respostas e anexos?')) return;
  document.querySelectorAll('select.resposta').forEach(function(s) {
    s.value = '';
    s.classList.remove('conforme', 'parcial', 'nc', 'na');
  });
  document.querySelectorAll('.obs-nc').forEach(function(t) { t.value = ''; });
  document.querySelectorAll('.pergunta').forEach(function(p) {
    p.classList.remove('has-nc', 'has-anexo');
  });
  Object.keys(imagensPorPergunta).forEach(function(k) { delete imagensPorPergunta[k]; });
  document.querySelectorAll('.anexos-thumbs').forEach(function(el) { el.innerHTML = ''; });
  document.getElementById('filial').value = '';
  document.getElementById('data').value = new Date().toISOString().split('T')[0];
  document.getElementById('auditor').value = '';
  document.getElementById('gestor').value = '';
  document.getElementById('obs-gerais').value = '';
  recalcularTudo();
}

document.addEventListener('DOMContentLoaded', function() {
  renderCapitulos();
  document.getElementById('data').value = new Date().toISOString().split('T')[0];
  recalcularTudo();
});
</script>
</body>
</html>
